name: CI-CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. Validate Python
  # ==========================================================

  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: |
          python -m compileall -q glue airflow


  # ==========================================================
  # 2. Validate Airflow DAG
  # ==========================================================

  validate-dag:
    name: Validate Airflow DAG
    runs-on: ubuntu-latest

    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow apache-airflow-providers-amazon pendulum

      - name: Compile DAG
        run: |
          python -m py_compile airflow/dags/snowflake_to_s3_glue.py


  # ==========================================================
  # 3. Deploy Glue scripts
  # ==========================================================

  deploy-glue:
    name: Deploy Glue scripts
    runs-on: ubuntu-latest

    needs:
      - validate
      - validate-dag

    # Deploy only for actual pushes.
    # Pull requests only validate the code.
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      GLUE_CODE_BUCKET: ${{ vars.GLUE_CODE_BUCKET }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Deploy Glue Job 1
      # ------------------------------------------------------

      - name: Upload Glue Job 1
        run: |
          aws s3 cp \
            glue/snowflake_to_s3/snowflake_to_s3.py \
            "s3://${GLUE_CODE_BUCKET}/glue/snowflake_to_s3/snowflake_to_s3.py"

      # ------------------------------------------------------
      # Deploy Glue Job 2
      # ------------------------------------------------------

      - name: Upload Glue Job 2
        run: |
          aws s3 cp \
            glue/preprocessing/marketing-model-preprocessing.py \
            "s3://${GLUE_CODE_BUCKET}/glue/preprocessing/marketing-model-preprocessing.py"

      - name: Deployment completed
        run: |
          echo "Glue Job 1 deployed successfully"
          echo "Glue Job 2 deployed successfully"