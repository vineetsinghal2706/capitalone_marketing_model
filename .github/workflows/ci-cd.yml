name: CI-CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# Default permissions
permissions:
  id-token: write
  contents: read


jobs:

  # ==========================================================
  # 1. Validate Python
  # ==========================================================

  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: |
          echo "Checking Python syntax..."
          python -m compileall -q glue airflow
          echo "Python syntax validation successful."


  # ==========================================================
  # 2. Validate Airflow DAG
  # ==========================================================

  validate-dag:
    name: Validate Airflow DAG
    runs-on: ubuntu-latest

    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow apache-airflow-providers-amazon pendulum

      - name: Compile DAG
        run: |
          echo "Checking Airflow DAG syntax..."
          python -m py_compile airflow/dags/snowflake_to_s3_glue.py
          echo "Airflow DAG validation successful."


  # ==========================================================
  # 3. Deploy Glue scripts
  # ==========================================================

  deploy-glue:
    name: Deploy Glue scripts
    runs-on: ubuntu-latest

    needs:
      - validate
      - validate-dag

    # Deploy only for actual pushes
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      GLUE_CODE_BUCKET: ${{ vars.GLUE_CODE_BUCKET }}

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Check GitHub configuration
      # ======================================================

      - name: Check GitHub configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CODE_BUCKET: ${{ vars.GLUE_CODE_BUCKET }}
        run: |

          echo "=============================================="
          echo "Checking GitHub Actions configuration"
          echo "=============================================="

          # Check AWS Role ARN
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_DEPLOY_ROLE_ARN is NOT configured."
            echo ""
            echo "Go to:"
            echo "GitHub Repository"
            echo "  -> Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"
            echo "  -> Variables"
            echo ""
            echo "Create repository variable:"
            echo "AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

          echo "AWS_DEPLOY_ROLE_ARN: configured"


          # Check S3 bucket
          if [ -z "$CODE_BUCKET" ]; then
            echo "ERROR: GLUE_CODE_BUCKET is NOT configured."
            echo ""
            echo "Go to:"
            echo "GitHub Repository"
            echo "  -> Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"
            echo "  -> Variables"
            echo ""
            echo "Create repository variable:"
            echo "GLUE_CODE_BUCKET"
            exit 1
          fi

          echo "GLUE_CODE_BUCKET: configured"


          # Check AWS region
          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is empty."
            exit 1
          fi

          echo "AWS_REGION: $AWS_REGION"

          echo ""
          echo "GitHub configuration validation successful."


      # ======================================================
      # Configure AWS credentials using GitHub OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # Check AWS credentials
      # ======================================================

      - name: Check AWS identity
        run: |

          echo "=============================================="
          echo "Checking AWS credentials"
          echo "=============================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS authentication successful."


      # ======================================================
      # Check S3 bucket
      # ======================================================

      - name: Check Glue code bucket
        run: |

          echo "=============================================="
          echo "Checking Glue code S3 bucket"
          echo "=============================================="

          echo "Bucket:"
          echo "$GLUE_CODE_BUCKET"

          aws s3 ls "s3://${GLUE_CODE_BUCKET}"

          echo ""
          echo "S3 bucket access successful."


      # ======================================================
      # Deploy Glue Job 1
      # ======================================================

      - name: Upload Glue Job 1
        run: |

          echo "=============================================="
          echo "Deploying Glue Job 1"
          echo "=============================================="

          aws s3 cp \
            glue/snowflake_to_s3/snowflake_to_s3.py \
            "s3://${GLUE_CODE_BUCKET}/glue/snowflake_to_s3/snowflake_to_s3.py"

          echo "Glue Job 1 uploaded successfully."


      # ======================================================
      # Deploy Glue Job 2
      # ======================================================

      - name: Upload Glue Job 2
        run: |

          echo "=============================================="
          echo "Deploying Glue Job 2"
          echo "=============================================="

          aws s3 cp \
            glue/preprocessing/marketing-model-preprocessing.py \
            "s3://${GLUE_CODE_BUCKET}/glue/preprocessing/marketing-model-preprocessing.py"

          echo "Glue Job 2 uploaded successfully."


      # ======================================================
      # Verify uploaded files
      # ======================================================

      - name: Verify Glue scripts
        run: |

          echo "=============================================="
          echo "Verifying deployed Glue scripts"
          echo "=============================================="

          echo ""
          echo "Glue Job 1:"
          aws s3 ls \
            "s3://${GLUE_CODE_BUCKET}/glue/snowflake_to_s3/"

          echo ""
          echo "Glue Job 2:"
          aws s3 ls \
            "s3://${GLUE_CODE_BUCKET}/glue/preprocessing/"

          echo ""
          echo "Glue scripts verified successfully."


      # ======================================================
      # Deployment completed
      # ======================================================

      - name: Deployment completed
        run: |

          echo "=============================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo "Glue Job 1: Deployed"
          echo "Glue Job 2: Deployed"
          echo "S3 bucket: ${GLUE_CODE_BUCKET}"
          echo "AWS region: ${AWS_REGION}"
